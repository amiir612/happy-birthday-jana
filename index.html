<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Amiri:ital@0;1&family=Cairo:wght@400;600&family=Libre+Baskerville:ital@0;1&family=Playfair+Display:ital@0;1&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--cream:#f2ece9;--maroon:#86454e;--wine:#8b3a46;--dark:#323232;--darker:#282828;--pink:#e7a3b1;--soft:#c9707f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins','Cairo',sans-serif;background:var(--dark);color:#eee;overflow-x:hidden}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer;color:inherit}

nav{position:fixed;inset:0 0 auto 0;height:44px;background:#2a2a2a;display:flex;justify-content:flex-end;align-items:center;gap:22px;padding:0 24px;z-index:50}
nav button{background:none;border:none;color:#9a9a9a;font-size:12px;transition:color .2s}
nav button.active,nav button:hover{color:#fff}

.page{display:none;min-height:100vh;padding-top:44px}
.page.active{display:block;animation:fadeIn .8s ease}
.pill{background:transparent;border:1.5px solid currentColor;border-radius:999px;padding:4px 18px;font-size:13px;transition:transform .25s,background .25s}
.pill:hover{transform:scale(1.06);background:rgba(255,255,255,.08)}
.end-row{width:100%;display:flex;justify-content:flex-end}

/* ---------- page 1 ---------- */
#p1{background:var(--cream);color:var(--wine)}
.hero{min-height:calc(100vh - 44px);display:flex;align-items:center;justify-content:space-evenly;flex-wrap:wrap;gap:40px;padding:40px 6vw}
.hero-title{font-family:'Amatic SC','Cairo',cursive;font-weight:700;font-size:clamp(56px,9vw,104px);line-height:1.15;display:flex;flex-direction:column}
.hero-title span{opacity:0;animation:rise .9s ease forwards}
.hero-title span:nth-child(1){padding-inline-start:.8em}
.hero-title span:nth-child(3){padding-inline-start:.4em}
.hero-pic{display:flex;flex-direction:column;align-items:center;gap:20px}
.face-wrap{position:relative;width:clamp(150px,22vw,230px);animation:float 4s ease-in-out infinite}
.face-wrap .face{width:100%;aspect-ratio:1;object-fit:contain}
.hat{position:absolute;width:32%;top:-24%;right:4%;transform-origin:50% 90%;animation:wiggle 2.6s ease-in-out infinite}

/* ---------- page 2 ---------- */
.sec{min-height:calc(100vh - 44px);display:flex;align-items:center;justify-content:center;padding:70px 6vw}
.traits{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:5vw;width:100%;max-width:1000px}
.trait-col{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(26px,5vh,44px)}
.trait-col.left{align-items:flex-end}
.trait{position:relative;font-size:clamp(13px,1.3vw,16px);color:#e9e9e9;opacity:0;transform:translateY(10px);transition:opacity .8s ease,transform .8s ease}
.show .trait{opacity:1;transform:none}
.blob-wrap{position:relative;width:clamp(220px,30vw,340px);aspect-ratio:1}
.blob{position:absolute;inset:0;background:#a3131d;border-radius:43% 57% 52% 48%/45% 42% 58% 55%;box-shadow:0 20px 50px rgba(0,0,0,.4);animation:morph 9s ease-in-out infinite}
.blob-wrap>img{position:absolute;top:13%;left:13%;width:74%;height:74%;object-fit:cover;border-radius:50%}
.spark{position:absolute;width:20px;height:20px;animation:twinkle 2.4s ease-in-out infinite}

.memories{display:grid;grid-template-columns:1fr 1fr;gap:5vw;align-items:center;width:100%;max-width:1050px}
.reveal{font-family:'Libre Baskerville','Amiri',serif;font-style:italic;font-size:clamp(16px,1.6vw,20px);line-height:1.95;color:#f1f1f1}
.reveal span{opacity:0;transition:opacity 1s ease}
.show .reveal span{opacity:1}
.reveal .hl{color:var(--soft)}
.collage{position:relative;width:100%;max-width:470px;aspect-ratio:47/42;margin:auto}
.polaroid{position:absolute;width:32%;background:#fafafa;padding:2.2% 2.2% 7%;box-shadow:0 10px 25px rgba(0,0,0,.45);transform:rotate(var(--r));opacity:0;transition:transform .35s ease}
.show .polaroid{opacity:1;animation:drop .8s ease backwards;animation-delay:var(--d)}
.polaroid:hover{transform:rotate(0) scale(1.12);z-index:10}
.polaroid img{width:100%;aspect-ratio:1;object-fit:cover}

.letter-wrap{display:flex;flex-direction:column;align-items:center;gap:34px;width:100%;max-width:700px}
.letter{width:100%;background:var(--maroon);border-radius:26px;padding:12px;box-shadow:0 18px 45px rgba(0,0,0,.4);opacity:0;transform:translateY(24px);transition:opacity 1s ease,transform 1s ease}
.show .letter{opacity:1;transform:none}
.letter-inner{border:1.5px solid #ecd3d7;border-radius:18px;padding:28px 32px;font-family:'Libre Baskerville','Amiri',serif;color:#fbf0f1;font-size:14.5px;line-height:1.8}
.letter-title{font-style:italic;color:#ebcbd0;margin-bottom:16px}
.letter-body{text-align:justify;white-space:pre-line}
.letter-sign{margin-top:28px}
.mini-row{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(16px,4vw,44px)}
.mini{width:clamp(48px,8vw,62px);aspect-ratio:1;object-fit:cover;filter:grayscale(1);border:2px solid #ddd;box-shadow:0 4px 12px rgba(0,0,0,.45);transition:.35s;position:relative}
.mini:hover{filter:none;transform:scale(1.6) rotate(-4deg);z-index:5}

/* ---------- page 3 : voice ---------- */
#p3{background:var(--darker)}
.voice{min-height:calc(100vh - 44px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:50px 6vw;text-align:center}
.voice h2{font-family:'Playfair Display','Amiri',serif;font-style:italic;font-weight:400;font-size:clamp(28px,4.2vw,46px);color:#f3e3e6}
.voice .sub{color:#a9a9a9;font-size:14px;margin-top:-12px}
.record{position:relative;width:clamp(200px,30vw,270px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:repeating-radial-gradient(circle,#151515 0 2px,#1f1f1f 2px 4px);box-shadow:0 22px 50px rgba(0,0,0,.55),inset 0 0 0 6px #0d0d0d;animation:spin 7s linear infinite paused}
.record.playing{animation-play-state:running}
.record img{width:40%;aspect-ratio:1;border-radius:50%;object-fit:cover;border:5px solid var(--maroon)}
.record::after{content:"";position:absolute;top:50%;left:50%;width:10px;height:10px;border-radius:50%;background:#eee;transform:translate(-50%,-50%)}
.vctrl{display:flex;align-items:center;gap:18px}
.wave{display:flex;align-items:center;gap:4px;height:42px}
.wave i{width:4px;height:var(--h);background:var(--pink);border-radius:4px;opacity:.45}
.wave.playing i{opacity:1;animation:bar 1s ease-in-out infinite;animation-delay:var(--dl)}
.play-btn{width:64px;height:64px;border-radius:50%;border:none;background:var(--maroon);display:grid;place-items:center;box-shadow:0 8px 24px rgba(134,69,78,.55);transition:transform .25s}
.play-btn:hover{transform:scale(1.08)}
.play-btn svg{width:26px;height:26px;fill:#fff}
.progress{width:min(360px,80vw);height:5px;background:#474747;border-radius:5px;overflow:hidden;cursor:pointer}
.progress div{height:100%;width:0;background:var(--pink);transition:width .25s linear}
.time{font-size:12px;color:#9a9a9a;margin-top:-12px}

/* ---------- page 4 : songs ---------- */
#p4{background:var(--maroon)}
.songs{min-height:calc(100vh - 44px);display:grid;grid-template-columns:minmax(200px,330px) 1fr;gap:6vw;align-items:center;padding:50px 6vw;max-width:1150px;margin:0 auto}
.songs-photo{position:relative}
.songs-photo img{width:100%;aspect-ratio:3/4;object-fit:cover;filter:grayscale(1) contrast(1.05);border:3px solid #2b2b2b;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.sq{position:absolute;width:6%;aspect-ratio:1;background:rgba(231,163,177,.8);animation:twinkle 3s ease-in-out infinite}
.songs-head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:40px}
.songs-head h2{font-family:'Playfair Display','Amiri',serif;font-weight:400;font-size:clamp(54px,7vw,86px);line-height:.9;color:#f3e5e7}
.songs-head span{color:#e6c2c8;font-size:16px;line-height:1.35;padding-bottom:8px}
.covers{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(22px,4vw,50px) clamp(26px,6vw,80px)}
.cover{position:relative;width:clamp(84px,10vw,112px);background:none;border:none;padding:0;transition:transform .3s}
.page.active .cover{animation:pop .6s ease backwards;animation-delay:var(--d)}
.cover:hover{transform:translateY(-6px) rotate(-2deg)}
.cover img{width:100%;aspect-ratio:1;object-fit:cover;border:3px solid #f4f4f4;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.cover.playing img{animation:pulse 1.3s ease-in-out infinite}
.cover .cap{display:block;margin-top:8px;font-size:11px;color:#f3dfe2;opacity:.9}
.eq{position:absolute;top:8px;right:8px;display:none;align-items:flex-end;gap:2px;height:18px;padding:3px 4px;background:rgba(0,0,0,.55);border-radius:4px}
.cover.playing .eq{display:flex}
.eq i{width:3px;height:100%;background:#fff;transform-origin:bottom;animation:bar .8s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
.now{margin-top:30px;text-align:center;opacity:0;transition:opacity .4s}
.now.on{opacity:1}
.now span{font-size:13px;color:#f7e9eb}
.now-bar{width:min(260px,70%);height:3px;margin:10px auto 0;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
.now-bar div{height:100%;width:0;background:#fff}
.songs .end-row{margin-top:24px}

/* ---------- music button + toast ---------- */
#musicBtn{position:fixed;right:18px;bottom:18px;width:46px;height:46px;border-radius:50%;border:none;background:rgba(255,255,255,.92);color:var(--wine);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:60;transition:transform .2s,opacity .2s}
#musicBtn:hover{transform:scale(1.08)}
#musicBtn.off{opacity:.55}
#musicBtn svg{width:20px;height:20px;fill:currentColor}
#toast{position:fixed;left:50%;bottom:80px;transform:translate(-50%,20px);background:#111;color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:70}
#toast.show{opacity:1;transform:translate(-50%,0)}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes wiggle{0%,100%{transform:rotate(18deg)}50%{transform:rotate(28deg)}}
@keyframes morph{0%,100%{border-radius:43% 57% 52% 48%/45% 42% 58% 55%;transform:rotate(0)}33%{border-radius:58% 42% 45% 55%/55% 58% 42% 45%;transform:rotate(6deg)}66%{border-radius:48% 52% 60% 40%/40% 52% 48% 60%;transform:rotate(-5deg)}}
@keyframes twinkle{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.15);opacity:1}}
@keyframes drop{from{opacity:0;transform:translateY(-40px) rotate(var(--r)) scale(1.1)}to{opacity:1;transform:rotate(var(--r))}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

@media (max-width:760px){
  nav{gap:14px;padding:0 14px}
  nav button{font-size:11px}
  .hero{flex-direction:column;justify-content:center}
  .hero-title{align-items:center;text-align:center}
  .hero-title span{padding-inline-start:0!important}
  .traits{grid-template-columns:1fr 1fr;row-gap:44px}
  .blob-wrap{grid-column:1/-1;order:-1;justify-self:center}
  .trait-col,.trait-col.left{align-items:center}
  .trait{left:0!important;right:0!important}
  .memories{grid-template-columns:1fr}
  .letter-inner{padding:22px 20px;font-size:14px}
  .songs{grid-template-columns:1fr}
  .songs-photo{max-width:230px;margin:0 auto}
  .songs-head{justify-content:center}
}
</style>
</head>
<body>
<nav id="nav"></nav>

<!-- ============ PAGE 1 ============ -->
<section class="page active" id="p1">
  <div class="hero">
    <h1 class="hero-title" id="heroTitle" dir="auto"></h1>
    <div class="hero-pic">
      <div class="face-wrap">
        <img class="face" id="babyImg" alt="">
        <svg class="hat" id="hat" viewBox="0 0 100 140" aria-hidden="true">
          <defs><clipPath id="cone"><path d="M50 12 L92 128 Q50 140 8 128 Z"/></clipPath></defs>
          <path d="M50 12 L92 128 Q50 140 8 128 Z" fill="#fff" stroke="#e3dada" stroke-width="2"/>
          <g clip-path="url(#cone)" fill="#d8262b">
            <circle cx="50" cy="34" r="5"/><circle cx="38" cy="56" r="5.5"/><circle cx="60" cy="58" r="5.5"/>
            <circle cx="28" cy="82" r="6"/><circle cx="50" cy="80" r="6"/><circle cx="72" cy="84" r="6"/>
            <circle cx="18" cy="108" r="6"/><circle cx="40" cy="104" r="6"/><circle cx="62" cy="106" r="6"/><circle cx="84" cy="112" r="6"/>
            <circle cx="30" cy="128" r="6"/><circle cx="72" cy="130" r="6"/>
          </g>
          <g stroke="#d8262b" stroke-width="2" fill="none" stroke-linecap="round">
            <path d="M50 12 q-10 -8 -6 -11"/><path d="M50 12 q6 -9 12 -8"/><path d="M50 12 q-2 -9 2 -11"/>
          </g>
        </svg>
      </div>
      <button class="pill" data-go="2">open me</button>
    </div>
  </div>
</section>

<!-- ============ PAGE 2 ============ -->
<section class="page" id="p2">
  <div class="sec observe">
    <div class="traits">
      <div class="trait-col left" id="traitsL"></div>
      <div class="blob-wrap" id="blobWrap"><div class="blob"></div><img id="mainImg" alt=""></div>
      <div class="trait-col" id="traitsR"></div>
    </div>
  </div>
  <div class="sec observe">
    <div class="memories">
      <p class="reveal" id="revealText" dir="auto"></p>
      <div class="collage" id="collage"></div>
    </div>
  </div>
  <div class="sec observe">
    <div class="letter-wrap">
      <div class="letter"><div class="letter-inner" dir="auto">
        <p class="letter-title" id="letterTitle"></p>
        <p class="letter-body" id="letterBody"></p>
        <p class="letter-sign" id="letterSign"></p>
      </div></div>
      <div class="mini-row" id="miniRow"></div>
      <div class="end-row"><button class="pill" data-go="3">next</button></div>
    </div>
  </div>
</section>

<!-- ============ PAGE 3 : VOICE ============ -->
<section class="page" id="p3">
  <div class="voice">
    <h2 id="voiceTitle" dir="auto"></h2>
    <p class="sub" id="voiceSub" dir="auto"></p>
    <div class="record" id="record"><img id="voiceImg" alt=""></div>
    <div class="vctrl">
      <div class="wave" id="waveL"></div>
      <button class="play-btn" id="voiceBtn" aria-label="play voice note"></button>
      <div class="wave" id="waveR"></div>
    </div>
    <div class="progress" id="vProg"><div id="vBar"></div></div>
    <div class="time" id="vTime">0:00 / 0:00</div>
    <button class="pill" data-go="4">next</button>
  </div>
</section>

<!-- ============ PAGE 4 : SONGS ============ -->
<section class="page" id="p4">
  <div class="songs">
    <div class="songs-photo" id="songsPhoto"><img id="songsImg" alt=""></div>
    <div>
      <div class="songs-head"><h2 id="songsTitle"></h2><span id="songsSub"></span></div>
      <div class="covers" id="covers"></div>
      <div class="now" id="now"><span id="nowText"></span><div class="now-bar"><div id="nowBar"></div></div></div>
      <div class="end-row"><button class="pill" data-go="3">back</button></div>
    </div>
  </div>
</section>

<button id="musicBtn" aria-label="music on/off"></button>
<div id="toast"></div>
<audio id="bg" loop preload="auto"></audio>

<script src="content.js"></script>
<script>
/* ده كود الموقع، مش محتاج تلمسه. كل الكلام في content.js */
if (typeof CONFIG === 'undefined') {
  document.body.innerHTML = '<div style="color:#fff;font-family:sans-serif;padding:40px;line-height:1.9;direction:rtl">فيه غلطة في ملف content.js<br>غالبًا علامة " أو فاصلة , اتمسحت بالغلط في آخر تعديل.</div>';
  throw new Error('content.js error');
}

const $ = id => document.getElementById(id);
const PAGES = 4;
const TX = Object.assign({ open: 'open me', next: 'next', back: 'back', nowPlaying: 'now playing' }, CONFIG.texts || {});

document.title = CONFIG.tabTitle || 'Happy Birthday';
document.querySelector('#p1 [data-go]').textContent = TX.open;
document.querySelector('#p2 .end-row [data-go]').textContent = TX.next;
document.querySelector('#p3 .voice > [data-go]').textContent = TX.next;
document.querySelector('#p4 .end-row [data-go]').textContent = TX.back;

function ph(label){
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect width="400" height="400" fill="#d8cdcd"/><text x="200" y="210" font-family="sans-serif" font-size="30" fill="#86454e" text-anchor="middle">${label}</text></svg>`);
}
function pic(src, label, cls = ''){
  return `<img src="${src}" class="${cls}" alt="" onerror="this.onerror=null;this.src=ph('${label}')">`;
}
function setImg(el, src, label){
  el.onerror = () => { el.onerror = null; el.src = ph(label); };
  el.src = src;
}
function fmt(s){ s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
let toastTimer;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}
function fadeTo(a, target, ms, done){
  clearInterval(a._fade);
  const from = a.volume, steps = 20; let i = 0;
  a._fade = setInterval(() => {
    i++;
    a.volume = Math.min(1, Math.max(0, from + (target - from) * i / steps));
    if (i >= steps){ clearInterval(a._fade); if (done) done(); }
  }, Math.max(10, ms / steps));
}

/* ---- nav ---- */
$('nav').innerHTML = CONFIG.navLabels.map((l, i) => `<button data-go="${i + 1}" class="${i === 0 ? 'active' : ''}">${l}</button>`).join('');

/* ---- page 1 ---- */
$('heroTitle').innerHTML = CONFIG.heroLines.map((l, i) => `<span style="animation-delay:${0.2 + i * 0.35}s">${l}</span>`).join('');
setImg($('babyImg'), CONFIG.babyPhoto, 'baby photo');
if (!CONFIG.showHat) $('hat').style.display = 'none';

/* ---- page 2 ---- */
function traitCol(list, side){
  const n = list.length;
  return list.map((t, i) => {
    const off = Math.round(42 * Math.sin(Math.PI * (n > 1 ? i / (n - 1) : 0.5)));
    return `<span class="trait" dir="auto" style="${side}:${off}px;transition-delay:${(0.2 + i * 0.2).toFixed(2)}s">${t}</span>`;
  }).join('');
}
$('traitsL').innerHTML = traitCol(CONFIG.traitsLeft, 'right');
$('traitsR').innerHTML = traitCol(CONFIG.traitsRight, 'left');
setImg($('mainImg'), CONFIG.mainPhoto, 'photo');
const SPARKS = [["#e8c547",4,8],["#8fbf6a",-2,60],["#b04fd6",22,95],["#e58fb8",55,-6],["#4fb3c9",92,10],["#e58fb8",88,82]];
$('blobWrap').insertAdjacentHTML('beforeend', SPARKS.map(([c, t, l], i) =>
  `<svg class="spark" viewBox="0 0 24 24" style="top:${t}%;left:${l}%;animation-delay:${i * 0.4}s"><path fill="${c}" d="M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z"/></svg>`).join(''));

(function buildReveal(){
  const text = CONFIG.memoriesText;
  const arabic = /[\u0600-\u06FF]/.test(text);
  let html = '';
  text.split(/(\*[^*]+\*)/).forEach(part => {
    if (!part) return;
    const hl = part.length > 2 && part.startsWith('*') && part.endsWith('*');
    const clean = hl ? part.slice(1, -1) : part;
    const units = arabic ? clean.split(/(\s+)/) : [...clean];
    units.forEach(u => {
      if (!u) return;
      if (/^\s+$/.test(u)){ html += ' '; return; }
      html += `<span${hl ? ' class="hl"' : ''} style="transition-delay:${(Math.random() * 2.8).toFixed(2)}s">${u}</span>`;
    });
  });
  $('revealText').innerHTML = html;
})();

const POS = [[4,2,-6],[33,7,5],[64,3,3],[1,46,4],[32,50,-3],[63,43,-7]];
$('collage').innerHTML = CONFIG.polaroids.slice(0, 6).map((src, i) => {
  const [l, t, r] = POS[i];
  return `<div class="polaroid" style="left:${l}%;top:${t}%;--r:${r}deg;--d:${(0.15 + i * 0.15).toFixed(2)}s">${pic(src, 'photo ' + (i + 1))}</div>`;
}).join('');

$('letterTitle').textContent = CONFIG.letterTitle;
$('letterBody').textContent = CONFIG.letter.trim();
$('letterSign').textContent = CONFIG.letterSign;
$('miniRow').innerHTML = CONFIG.letterPhotos.map((s, i) => pic(s, 'pic ' + (i + 1), 'mini')).join('');

/* ---- page 3 ---- */
$('voiceTitle').textContent = CONFIG.voiceTitle;
$('voiceSub').textContent = CONFIG.voiceSubtitle;
setImg($('voiceImg'), CONFIG.voicePhoto, 'photo');
const bars = n => Array.from({ length: n }, () => `<i style="--h:${Math.round(30 + Math.random() * 70)}%;--dl:${(Math.random() * 0.9).toFixed(2)}s"></i>`).join('');
$('waveL').innerHTML = bars(9);
$('waveR').innerHTML = bars(9);

/* ---- page 4 ---- */
$('songsTitle').textContent = CONFIG.songsTitle;
$('songsSub').innerHTML = CONFIG.songsSubtitle;
setImg($('songsImg'), CONFIG.songsPhoto, 'photo');
const SQ = [[8,-3],[3,10],[30,93],[46,96],[70,-4],[88,80],[96,40]];
$('songsPhoto').insertAdjacentHTML('beforeend', SQ.map(([t, l], i) => `<span class="sq" style="top:${t}%;left:${l}%;animation-delay:${i * 0.35}s"></span>`).join(''));
$('covers').innerHTML = CONFIG.songs.map((s, i) => `
  <button class="cover" data-i="${i}" style="--d:${(i * 0.12).toFixed(2)}s">
    ${pic(s.cover, 'cover ' + (i + 1))}
    <span class="eq"><i></i><i></i><i></i></span>
    ${CONFIG.showSongTitles ? `<span class="cap" dir="auto">${s.title}</span>` : ''}
  </button>`).join('');

/* ---- audio ---- */
const ICON = {
  play:  '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>',
  note:  '<svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>',
  mute:  '<svg viewBox="0 0 24 24"><path d="M4.27 3 3 4.27l9 9v.28A4 4 0 1 0 14 17v-1.73L19.73 21 21 19.73 4.27 3zM14 7h4V3h-6v5.18l2 2V7z"/></svg>'
};
const bg = $('bg');
bg.src = CONFIG.bgMusic;
const voice = new Audio(CONFIG.voiceNote);
voice.preload = 'metadata';
const song = new Audio();
let started = false, musicOn = true, current = -1, playToken = 0;

function playBg(){
  if (!started || !musicOn || current >= 0 || !voice.paused) return;
  if (bg.paused){
    bg.volume = 0;
    bg.play().catch(e => { if (e.name === 'NotSupportedError') toast('background music file not found'); });
  }
  fadeTo(bg, CONFIG.bgVolume, 1400);
}
function pauseBg(){ if (!bg.paused) fadeTo(bg, 0, 500, () => bg.pause()); }

function updMusicBtn(){ const b = $('musicBtn'); b.innerHTML = musicOn ? ICON.note : ICON.mute; b.classList.toggle('off', !musicOn); }
updMusicBtn();
$('musicBtn').addEventListener('click', () => {
  if (!started){ started = true; musicOn = true; } else musicOn = !musicOn;
  musicOn ? playBg() : pauseBg();
  updMusicBtn();
});

/* voice */
const voiceBtn = $('voiceBtn');
voiceBtn.innerHTML = ICON.play;
function setVoiceUI(on){
  voiceBtn.innerHTML = on ? ICON.pause : ICON.play;
  $('record').classList.toggle('playing', on);
  document.querySelectorAll('.wave').forEach(w => w.classList.toggle('playing', on));
}
function updVoiceTime(){
  const d = isFinite(voice.duration) ? voice.duration : 0;
  $('vBar').style.width = d ? (voice.currentTime / d * 100) + '%' : '0%';
  $('vTime').textContent = fmt(voice.currentTime) + ' / ' + fmt(d);
}
voiceBtn.addEventListener('click', () => {
  started = true;
  if (voice.paused){
    stopSong(false);
    pauseBg();
    voice.play().catch(e => {
      setVoiceUI(false);
      if (e.name === 'NotSupportedError') toast('voice note file not found');
      playBg();
    });
  } else voice.pause();
});
voice.addEventListener('play', () => setVoiceUI(true));
voice.addEventListener('pause', () => { setVoiceUI(false); playBg(); });
voice.addEventListener('timeupdate', updVoiceTime);
voice.addEventListener('loadedmetadata', updVoiceTime);
$('vProg').addEventListener('click', e => {
  if (!isFinite(voice.duration)) return;
  const r = e.currentTarget.getBoundingClientRect();
  voice.currentTime = (e.clientX - r.left) / r.width * voice.duration;
});

/* songs */
function markCovers(){
  document.querySelectorAll('.cover').forEach(b => b.classList.toggle('playing', +b.dataset.i === current));
  $('now').classList.toggle('on', current >= 0);
}
function stopSong(resume){
  if (current < 0) return;
  current = -1;
  playToken++;
  clearInterval(song._fade);
  song.pause();
  markCovers();
  if (resume) playBg();
}
function playSong(i){
  started = true;
  if (current === i){ stopSong(true); return; }
  stopSong(false);
  const s = CONFIG.songs[i];
  current = i;
  const token = ++playToken;
  voice.pause();
  pauseBg();
  song._fading = false;
  song.volume = 1;
  song.src = s.file + '#t=' + (s.start || 0);
  song.play().catch(e => {
    if (token !== playToken) return;
    if (e.name === 'NotSupportedError') toast('song file not found');
    stopSong(true);
  });
  $('nowText').textContent = TX.nowPlaying + ' · ' + s.title + (s.artist ? ' — ' + s.artist : '');
  $('nowBar').style.width = '0%';
  markCovers();
}
song.addEventListener('timeupdate', () => {
  if (current < 0) return;
  const s = CONFIG.songs[current];
  const start = s.start || 0;
  const end = s.end || (isFinite(song.duration) ? song.duration : 0);
  if (!end) return;
  const left = end - song.currentTime;
  $('nowBar').style.width = Math.min(100, Math.max(0, (song.currentTime - start) / (end - start) * 100)) + '%';
  if (left < 1.6 && !song._fading){ song._fading = true; fadeTo(song, 0, Math.max(250, left * 1000)); }
  if (left <= 0.05) stopSong(true);
});
song.addEventListener('ended', () => stopSong(true));
document.querySelectorAll('.cover').forEach(b => b.addEventListener('click', () => playSong(+b.dataset.i)));

/* ---- navigation ---- */
function go(n){
  n = Math.min(PAGES, Math.max(1, n));
  stopSong(false);
  voice.pause();
  document.querySelectorAll('.page').forEach((p, i) => p.classList.toggle('active', i + 1 === n));
  document.querySelectorAll('nav button').forEach((b, i) => b.classList.toggle('active', i + 1 === n));
  window.scrollTo(0, 0);
  playBg();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go]');
  if (!t) return;
  started = true;
  go(+t.dataset.go);
});

/* ---- scroll animations ---- */
const io = new IntersectionObserver(entries => entries.forEach(en => {
  if (en.isIntersecting) en.target.classList.add('show');
}), { threshold: 0.2 });
document.querySelectorAll('.observe').forEach(el => io.observe(el));
</script>
</body>
</html>
