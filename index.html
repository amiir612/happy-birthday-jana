فاللي عايز اقوله ليكي في الاخر اني بحبك اوي اوي. كل سنة وانتي طيبه يا جنجونتي وعقبال مليون سنه. يارب السنة الجديده تحققي كل حاجه بتحلمي بيها وتبقي دايما بخير وسعاده يا اشطر واحلي واجمل جنجون في الدنيا كلها. بحبك اوي ويارب اشوفك بخير وسعاده دايما 💜`,

<title>Happy Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Amiri:ital@0;1&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600&family=Caveat:wght@500;600&family=Fredoka:wght@600;700&family=Libre+Baskerville:ital@0;1&family=Playfair+Display:ital@0;1&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ---------- themes ---------- */
:root{
  --cream:#f2ece9;--main:#86454e;--deep:#8b3a46;--accent:#e7a3b1;--soft:#c9707f;--blob:#a3131d;
  --env1:#6f3540;--env2:#8f4651;--env3:#a0525e;
  --ink:#6b2f3a;--ink-soft:#9b5c66;--paper-ink:#4a2a30;--paper-line:#ead9d5;--paper:#fbf6f0;--plate:#e9e2df;
  --tint:#f6dfe3;--tint-text:#f8ecee;
  --dark:#323232;--darker:#282828;--nav:#2a2a2a;--finale-bg:#3a2a2d;--hat:#d8262b;
  --candle:var(--accent);--candle2:#fff;
}
html.theme-purple{
  --cream:#f3eef8;--main:#6a4c93;--deep:#4e2d74;--accent:#c9a8f0;--soft:#b48ae6;--blob:#7b2cbf;
  --env1:#4a2f6b;--env2:#5e3f86;--env3:#71509c;
  --ink:#4e2d74;--ink-soft:#7d62a0;--paper-ink:#3b2752;--paper-line:#e4daf0;--paper:#fbf8fc;--plate:#e9e5ec;
  --tint:#ece0f8;--tint-text:#f6effc;
  --dark:#2c2833;--darker:#231f29;--nav:#25212b;--finale-bg:#3b2d52;--hat:#8a3ffc;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Poppins','Cairo',sans-serif;background:var(--dark);color:#eee;overflow-x:hidden}
img{display:block;max-width:100%}
button{font:inherit;cursor:pointer;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}

/* ---------- gate ---------- */
.gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:30px 6vw;background:radial-gradient(ellipse at 50% 35%,var(--main) 0%,var(--darker) 75%);color:#fff;text-align:center;overflow-y:auto;transition:opacity 0.6s ease,visibility 0s linear 0.6s}
.gate.leave{opacity:0;visibility:hidden}
.gate.gone{display:none}
.gate-box{max-width:620px;display:flex;flex-direction:column;align-items:center;gap:16px;animation:rise 0.8s ease}
.gate-kicker{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--accent)}
.gate-title{font-family:'Caveat','Aref Ruqaa',cursive;font-weight:600;font-size:clamp(38px,7vw,68px);line-height:1.05;color:var(--tint-text)}
.gate-sub{font-size:14px;color:#e6d3d7}
.gate-count{display:flex;gap:clamp(8px,2vw,16px);justify-content:center;flex-wrap:wrap}
.cd-b{min-width:clamp(64px,16vw,96px);padding:12px 8px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15)}
.cd-b b{display:block;font-family:'Fredoka','Poppins',sans-serif;font-weight:700;font-size:clamp(30px,7vw,48px);line-height:1}
.cd-b span{display:block;margin-top:6px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#d9c3c8}
.gate-note{font-size:14px;color:#e6d3d7}
.gate-stats{display:flex;flex-direction:column;gap:6px;font-family:'Libre Baskerville','Amiri',serif;font-style:italic;font-size:14px;color:#f3e3e6}
.gate-btn{margin-top:8px;border:none;border-radius:999px;background:#fff;color:var(--deep);font-size:16px;padding:12px 30px;box-shadow:0 10px 26px rgba(0,0,0,.35);animation:pulse 2s ease-in-out infinite}
.gate-btn[hidden]{display:none}

nav{position:fixed;inset:0 0 auto 0;height:44px;background:var(--nav);display:flex;justify-content:flex-end;align-items:center;gap:22px;padding:0 24px;z-index:50}
nav button{background:none;border:none;color:#9a9a9a;font-size:12px;transition:color .2s}
nav button.active,nav button:hover{color:#fff}

.page{display:none;min-height:100vh;min-height:100svh;padding-top:44px}
.page.active{display:block;animation:fadeIn .5s ease}
.pill{background:transparent;border:1.5px solid currentColor;border-radius:999px;padding:5px 20px;font-size:13px;transition:transform .25s,background .25s}
.pill:hover{transform:scale(1.06);background:rgba(255,255,255,.08)}
.end-row{width:100%;display:flex;justify-content:flex-end}

/* ---------- page 1 : hero ---------- */
#p1{background:var(--cream);color:var(--deep)}
.hero{min-height:calc(100vh - 44px);min-height:calc(100svh - 44px);display:flex;align-items:center;justify-content:space-evenly;flex-wrap:wrap;gap:40px;padding:40px 6vw}
.hero-title{font-family:'Amatic SC','Cairo',cursive;font-weight:700;font-size:clamp(56px,9vw,104px);line-height:1.15;display:flex;flex-direction:column}
.hero-title span{opacity:0;animation:rise .7s ease forwards}
.hero-title span:nth-child(1){padding-inline-start:.8em}
.hero-title span:nth-child(3){padding-inline-start:.4em}
.hero-pic{display:flex;flex-direction:column;align-items:center;gap:20px}
.face-wrap{position:relative;width:clamp(150px,22vw,230px);animation:float 4s ease-in-out infinite}
.face-wrap .face{width:100%;aspect-ratio:1;object-fit:contain}
.hat{position:absolute;width:32%;top:-24%;right:4%;transform-origin:50% 90%;animation:wiggle 2.6s ease-in-out infinite}

/* ---------- page 2 ---------- */
.sec{min-height:calc(100vh - 44px);min-height:calc(100svh - 44px);display:flex;align-items:center;justify-content:center;padding:70px 6vw}
.traits{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:5vw;width:100%;max-width:1000px}
.trait-col{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(26px,5vh,44px)}
.trait-col.left{align-items:flex-end}
.trait{position:relative;font-size:clamp(13px,1.3vw,16px);color:#ececec;opacity:0;transform:translateY(10px);transition:opacity .6s ease,transform .6s ease}
.show .trait{opacity:1;transform:none}
.blob-wrap{position:relative;width:clamp(220px,30vw,340px);aspect-ratio:1}
.blob{position:absolute;inset:0;background:var(--blob);border-radius:43% 57% 52% 48%/45% 42% 58% 55%;box-shadow:0 20px 50px rgba(0,0,0,.4);animation:morph 9s ease-in-out infinite}
.blob-wrap>img{position:absolute;top:13%;left:13%;width:74%;height:74%;object-fit:cover;border-radius:50%}

.memories{display:grid;grid-template-columns:1fr 1fr;gap:5vw;align-items:center;width:100%;max-width:1050px}
.reveal{font-family:'Libre Baskerville','Amiri',serif;font-style:italic;font-size:clamp(16px,1.6vw,20px);line-height:1.95;color:#f1f1f1}
.reveal span{opacity:0;transition:opacity .6s ease}
.show .reveal span{opacity:1}
.reveal .hl{color:var(--soft)}
.collage{position:relative;width:100%;max-width:470px;aspect-ratio:47/42;margin:auto}
.polaroid{position:absolute;width:32%;background:#fafafa;padding:2.2% 2.2% 7%;box-shadow:0 10px 25px rgba(0,0,0,.45);transform:rotate(var(--r));opacity:0;transition:transform .35s ease}
.show .polaroid{opacity:1;animation:drop .6s ease backwards;animation-delay:var(--d)}

.letter-wrap{display:flex;flex-direction:column;align-items:center;gap:34px;width:100%;max-width:700px}
.letter{width:100%;background:var(--main);border-radius:26px;padding:12px;box-shadow:0 18px 45px rgba(0,0,0,.4);opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s ease}
.show .letter{opacity:1;transform:none}
.letter-inner{border:1.5px solid var(--tint);border-radius:18px;padding:28px 32px;font-family:'Libre Baskerville','Amiri',serif;color:var(--tint-text);font-size:14.5px;line-height:1.8}

/* ---------- page 3 : gallery ---------- */
#p3{background:var(--cream);color:var(--deep)}
.gallery{max-width:1100px;margin:0 auto;padding:60px 6vw 70px;text-align:center}
.g-title{font-family:'Amatic SC','Cairo',cursive;font-weight:700;font-size:clamp(44px,6vw,72px);line-height:1.1}
.g-sub{font-family:'Libre Baskerville','Amiri',serif;font-style:italic;font-size:15px;color:var(--ink-soft);margin:8px 0 50px}
.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:50px 34px;margin-bottom:44px}
.g-card{position:relative;background:#fff;border:none;padding:12px 12px 16px;box-shadow:0 10px 24px rgba(60,25,35,.18);transform:rotate(var(--r));transition:transform .35s}

/* ---------- page 4 : 21 reasons ---------- */
#p4{background:var(--tint);color:var(--deep)}
.reasons{max-width:980px;margin:0 auto;padding:56px 5vw 70px;text-align:center}
.r-title{font-family:'Amatic SC','Cairo',cursive;font-weight:700;font-size:clamp(42px,6vw,70px);line-height:1.1}
.r-sub{font-family:'Libre Baskerville','Amiri',serif;font-style:italic;font-size:14px;color:var(--ink-soft);margin:6px 0 34px}
.r-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:14px}
.rcard{position:relative;aspect-ratio:3/4;perspective:800px;background:none;border:none;padding:0}
.rinner{position:absolute;inset:0;transition:transform .5s cubic-bezier(.3,.7,.3,1.2);transform-style:preserve-3d}
.rcard.flip .rinner{transform:rotateY(180deg)}
.rface{position:absolute;inset:0;border-radius:12px;-webkit-backface-visibility:hidden;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;box-shadow:0 8px 18px rgba(80,30,40,.2)}
.rfront{background:var(--main);color:#fff}
.rback{background:#fff;color:var(--ink);transform:rotateY(180deg);font-family:'Caveat','Aref Ruqaa',cursive;font-size:clamp(15px,1.7vw,19px);line-height:1.15;overflow:hidden}

/* ---------- page 5 : message (الجواب) ---------- */
#p5{background:var(--dark)}
.msg{min-height:calc(100vh - 44px);min-height:calc(100svh - 44px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:60px 6vw}
.env-wrap{display:flex;flex-direction:column;align-items:center;gap:24px}
.env-wrap.gone{display:none}
.envelope{position:relative;width:min(340px,80vw);aspect-ratio:3/2;cursor:pointer;perspective:900px;animation:float 4s ease-in-out infinite}
.env-back{position:absolute;inset:0;background:var(--env1);border-radius:8px;box-shadow:0 22px 50px rgba(0,0,0,.45)}
.env-paper{position:absolute;left:7%;right:7%;top:8%;height:82%;background:var(--paper);border-radius:4px;z-index:1;transition:transform .8s ease .45s}
.env-front{position:absolute;inset:0;background:var(--env2);border-radius:8px;clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);z-index:2}
.env-flap{position:absolute;left:0;right:0;top:0;height:62%;background:var(--env3);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;z-index:3;transition:transform .6s ease,z-index 0s .3s}
.env-seal{position:absolute;left:50%;top:58%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--soft);color:#fff;display:grid;place-items:center;font-size:20px;z-index:4;box-shadow:0 3px 8px rgba(0,0,0,.3);transition:opacity .3s}
.envelope.open .env-flap{transform:rotateX(180deg);z-index:0}
.envelope.open .env-seal{opacity:0}
.envelope.open .env-paper{transform:translateY(-48%)}
.paper{display:none;width:min(640px,92vw);background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:46px 42px 40px;box-shadow:0 25px 60px rgba(0,0,0,.5);--lh:36px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--lh) - 1px),var(--paper-line) calc(var(--lh) - 1px),var(--paper-line) var(--lh));background-position:0 46px;font-family:'Caveat','Aref Ruqaa','Amiri',cursive;font-size:25px;line-height:var(--lh)}
.paper.show{display:block;animation:paperIn .7s ease}
.paper p{margin:0 0 var(--lh);opacity:0;transform:translateY(8px);transition:opacity .6s ease,transform .6s ease}
.paper p.in{opacity:1;transform:none}
.paper .m-to{font-weight:600;direction:ltr;text-align:left;font-family:'Caveat',cursive}
.paper .m-body{white-space:pre-line;direction:rtl;text-align:right;font-size:22px;line-height:1.8}
.paper .m-from{text-align:right;margin-bottom:0;font-weight:600;direction:ltr;font-family:'Caveat',cursive}

/* ---------- page 6 : voice ---------- */
#p6{background:var(--darker)}
.voice{min-height:calc(100vh - 44px);min-height:calc(100svh - 44px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:50px 6vw;text-align:center}
.record{position:relative;width:clamp(200px,30vw,270px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:repeating-radial-gradient(circle,#151515 0 2px,#1f1f1f 2px 4px);box-shadow:0 22px 50px rgba(0,0,0,.55),inset 0 0 0 6px #0d0d0d;animation:spin 7s linear infinite paused}
.record.playing{animation-play-state:running}
.record img{width:40%;aspect-ratio:1;border-radius:50%;object-fit:cover;border:5px solid var(--main)}
.vctrl{display:flex;align-items:center;gap:18px}
.wave{display:flex;align-items:center;gap:4px;height:42px}
.wave i{width:4px;height:var(--h);background:var(--accent);border-radius:4px;opacity:.45}
.wave.playing i{opacity:1;animation:bar 1s ease-in-out infinite;animation-delay:var(--dl)}
.play-btn{width:64px;height:64px;border-radius:50%;border:none;background:var(--main);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:transform .25s}
.play-btn:hover{transform:scale(1.08)}
.play-btn svg{width:26px;height:26px;fill:#fff}
.progress{width:min(360px,80vw);height:6px;background:#474747;border-radius:6px;overflow:hidden;cursor:pointer}
.progress div{height:100%;width:0;background:var(--accent);transition:width .25s linear}
.time{font-size:12px;color:#9a9a9a;margin-top:-12px}

/* ---------- page 7 : songs ---------- */
#p7{background:var(--main)}
.songs{min-height:calc(100vh - 44px);min-height:calc(100svh - 44px);display:grid;grid-template-columns:minmax(200px,330px) 1fr;gap:6vw;align-items:center;padding:50px 6vw;max-width:1150px;margin:0 auto}
.songs-photo{position:relative}
.songs-photo img{width:100%;aspect-ratio:3/4;object-fit:cover;border:3px solid #2b2b2b;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.songs-head{display:flex;flex-direction:column;gap:6px;margin-bottom:28px}
.songs-head h2{font-family:'Playfair Display','Amiri',serif;font-weight:400;font-size:clamp(54px,7vw,86px);line-height:.9;color:var(--tint-text)}
.songs-head span{color:var(--tint);font-size:16px;line-height:1.35}
.songs-hint{font-size:12px;color:rgba(255,255,255,0.65);font-weight:300;letter-spacing:0.5px;margin-top:2px}
.covers{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(16px,2.5vw,32px)}
.cover{position:relative;width:clamp(80px,8.5vw,100px);background:none;border:none;padding:0;transition:transform .25s}
.page.active .cover{animation:pop .4s ease backwards;animation-delay:var(--d)}
.cover:hover{transform:translateY(-4px) rotate(-2deg)}
.cover img{width:100%;aspect-ratio:1;object-fit:cover;border:3px solid #f4f4f4;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.cover.playing img{animation:pulse 1.3s ease-in-out infinite}
.cover .cap{display:block;margin-top:8px;font-size:11px;color:var(--tint-text);opacity:.9}
.now{margin-top:24px;text-align:center;opacity:0;transition:opacity .4s}
.now.on{opacity:1}
.now span{font-size:13px;color:var(--tint-text)}
.now-bar{width:min(260px,70%);height:3px;margin:8px auto 0;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
.now-bar div{height:100%;width:0;background:#fff}

/* ---------- page 8 : question ---------- */
#p8{background:var(--cream);color:var(--deep)}
.ask{min-height:calc(100vh - 44px);min-height:calc(100svh - 44px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:50px 6vw;text-align:center}
.ask-img{width:clamp(170px,26vw,260px);aspect-ratio:1;object-fit:cover;border-radius:22px;border:6px solid #fff;box-shadow:0 14px 34px rgba(80,30,40,.22);transform:rotate(-2deg)}
.ask-q{font-family:'Amatic SC','Cairo',cursive;font-weight:700;font-size:clamp(44px,7vw,78px);line-height:1.05}
.ask-btns{display:flex;gap:22px;align-items:center;justify-content:center;min-height:70px;position:relative}
.yes-btn{border:none;border-radius:999px;background:var(--main);color:#fff;font-size:18px;padding:11px 36px;box-shadow:0 10px 24px rgba(0,0,0,.2);transition:transform .2s}
.yes-btn:hover{transform:scale(1.05)}
.no-btn{border:2px solid var(--deep);background:#fff;color:var(--deep);border-radius:999px;font-size:16px;padding:9px 28px;white-space:nowrap;transition:left .2s ease,top .2s ease;z-index:5}
.no-btn.run{position:fixed}
.ask-yes{display:none;flex-direction:column;align-items:center;gap:18px}
.ask.done .ask-btns,.ask.done .ask-q{display:none}
.ask.done .ask-yes{display:flex;animation:rise .8s ease}
.yes-msg{font-family:'Caveat','Aref Ruqaa',cursive;font-size:clamp(34px,5vw,54px)}

/* ---------- page 9 : cake ---------- */
#p9{background:radial-gradient(ellipse at 50% 40%,var(--finale-bg) 0%,var(--darker) 70%)}
.finale{min-height:calc(100vh - 44px);min-height:calc(100svh - 44px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:60px 6vw;text-align:center}
.f-title{font-family:'Amatic SC','Cairo',cursive;font-weight:700;font-size:clamp(46px,7vw,80px);color:var(--tint);line-height:1.05}
.f-hint{font-size:13px;color:#b9b9b9;transition:opacity .4s}
.cake-wrap{position:relative;margin:30px 0 10px}
.cake-wrap::before{content:"";position:absolute;left:50%;top:-40px;width:min(420px,100vw);height:300px;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 30%,rgba(255,190,90,.28),transparent 65%);pointer-events:none;transition:opacity 1.2s}
.cake-wrap.out::before{opacity:0}
.cake{position:relative;width:min(290px,76vw);display:flex;flex-direction:column;align-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.candles{width:62%;height:76px;display:flex;justify-content:space-evenly;align-items:flex-end}
.candles.nums{height:104px;justify-content:center;gap:4px}
.candle{position:relative;width:10px;border-radius:3px 3px 0 0;background:repeating-linear-gradient(-45deg,var(--candle2) 0 6px,var(--candle) 6px 12px)}
.candle::before{content:"";position:absolute;top:-7px;left:50%;width:2px;height:7px;margin-left:-1px;background:#3a3a3a}
.candle.num{width:auto;background:none;border-radius:0}
.candle.num .digit{display:block;font-family:'Fredoka','Poppins',sans-serif;font-weight:700;font-size:76px;line-height:.8;background:repeating-linear-gradient(-45deg,var(--candle2) 0 7px,var(--candle) 7px 14px);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
.flame{position:absolute;bottom:calc(100% + 5px);left:50%;width:12px;height:24px;margin-left:-6px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 72%,#fffbe0 0 18%,#ffd45c 38%,#ff9a3c 66%,rgba(255,120,40,0) 72%);filter:drop-shadow(0 0 8px rgba(255,190,80,.9));transform-origin:50% 100%;animation:flicker .14s ease-in-out infinite alternate;transition:opacity .35s,transform .35s}
.candle.num .flame{width:14px;height:28px;margin-left:-7px}
.smoke{position:absolute;bottom:calc(100% + 8px);left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:rgba(225,225,225,.55);opacity:0;pointer-events:none}
.candle.out .flame{opacity:0;transform:scale(.2);animation:none}
.candle.out .smoke{animation:smoke 1.8s ease-out forwards}
.tier{position:relative;border-radius:12px 12px 6px 6px}
.tier.top{width:62%;height:64px;background:var(--tint);--icing:#fff}
.tier.bottom{width:100%;height:88px;background:var(--main);--icing:var(--tint)}
.tier::before{content:"";position:absolute;left:0;right:0;top:0;height:14px;background:var(--icing);border-radius:12px 12px 0 0}
.tier::after{content:"";position:absolute;left:0;right:0;top:13px;height:13px;background:radial-gradient(circle at 50% 0,var(--icing) 8px,transparent 9px) 0 0/18px 13px repeat-x}
.tier .dots{position:absolute;left:8%;right:8%;bottom:16px;height:10px;background:radial-gradient(circle,var(--tint) 3px,transparent 4px) 0 0/22px 10px repeat-x}
.plate{width:118%;height:16px;margin-top:-4px;border-radius:50%;background:var(--plate);box-shadow:0 14px 30px rgba(0,0,0,.45)}
.f-final{font-family:'Caveat','Aref Ruqaa',cursive;font-size:clamp(26px,3.6vw,36px);color:var(--tint-text);max-width:560px;line-height:1.3;opacity:0;transform:translateY(12px);transition:opacity 1.2s ease .6s,transform 1.2s ease .6s}
.f-again{color:#eee;opacity:0;pointer-events:none;transition:opacity 1s ease 1.6s}
.finale.done .f-final{opacity:1;transform:none}
.finale.done .f-again{opacity:1;pointer-events:auto}
.finale.done .f-hint{opacity:0}

/* ---------- modals & overlays ---------- */
.lightbox{position:fixed;inset:0;background:rgba(20,10,14,.88);display:flex;align-items:center;justify-content:center;padding:30px;z-index:80;opacity:0;pointer-events:none;transition:opacity .3s}
.lightbox.on{opacity:1;pointer-events:auto}
.lightbox figure{background:#fff;padding:14px 14px 18px;max-width:min(520px,90vw);transform:scale(.92);transition:transform .3s}
.lightbox.on figure{transform:none}
.lightbox img{width:100%;max-height:70vh;object-fit:contain}
.lightbox figcaption{margin-top:12px;font-family:'Caveat','Aref Ruqaa',cursive;font-size:24px;color:var(--ink);text-align:center}

#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:101}
#musicBtn{position:fixed;right:18px;bottom:18px;width:46px;height:46px;border-radius:50%;border:none;background:rgba(255,255,255,.92);color:var(--deep);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:60;transition:transform .2s,opacity .2s}
#musicBtn:hover{transform:scale(1.08)}
#musicBtn.off{opacity:.55}
#musicBtn svg{width:20px;height:20px;fill:currentColor}
#toast{position:fixed;left:50%;bottom:80px;transform:translate(-50%,20px);background:#111;color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:98}
#toast.show{opacity:1;transform:translate(-50%,0)}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes wiggle{0%,100%{transform:rotate(18deg)}50%{transform:rotate(28deg)}}
@keyframes morph{0%,100%{border-radius:43% 57% 52% 48%/45% 42% 58% 55%;transform:rotate(0)}33%{border-radius:58% 42% 45% 55%/55% 58% 42% 45%;transform:rotate(6deg)}66%{border-radius:48% 52% 60% 40%/40% 52% 48% 60%;transform:rotate(-5deg)}}
@keyframes twinkle{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.15);opacity:1}}
@keyframes drop{from{opacity:0;transform:translateY(-40px) rotate(var(--r)) scale(1.1)}to{opacity:1;transform:rotate(var(--r))}}
@keyframes paperIn{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes flicker{from{transform:scaleY(1) rotate(-2deg)}to{transform:scaleY(1.12) rotate(2deg)}}
@keyframes smoke{0%{opacity:.7;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-46px) scale(3)}}

/* ---------- mobile ---------- */
@media (max-width:760px){
  nav{gap:14px;padding:0 10px;justify-content:center}
  nav button{font-size:0}
  nav button::after{content:attr(data-num);font-size:13px}
  .hero{flex-direction:column;justify-content:center}
  .sec{padding:60px 5vw}
  .traits{grid-template-columns:1fr 1fr;row-gap:44px}
  .blob-wrap{grid-column:1/-1;order:-1;justify-self:center}
  .memories{grid-template-columns:1fr;gap:40px}
  .paper{padding:32px 20px 26px;--lh:30px;font-size:20px}
  .paper .m-body{font-size:20px;line-height:1.75}
  .songs{grid-template-columns:1fr;gap:36px}
  .covers{gap:18px 14px}
  .cover{width:76px}
}
</style>
</head>
<body>

<!-- ============ GATE ============ -->
<div class="gate" id="gate">
  <div class="gate-box">
    <p class="gate-kicker" id="gateKicker"></p>
    <h1 class="gate-title" id="gateTitle" dir="auto"></h1>
    <p class="gate-sub" id="gateSub" dir="auto"></p>
    <div class="gate-count" id="gateCount"></div>
    <p class="gate-note" id="gateNote" dir="auto"></p>
    <div class="gate-stats" id="gateStats"></div>
    <button class="gate-btn" id="gateBtn" hidden></button>
  </div>
</div>

<nav id="nav"></nav>

<!-- ============ PAGE 1 ============ -->
<section class="page active" id="p1">
  <div class="hero">
    <h1 class="hero-title" id="heroTitle" dir="auto"></h1>
    <div class="hero-pic">
      <div class="face-wrap">
        <img class="face" id="babyImg" alt="">
      </div>
      <button class="pill" id="openBtn" data-go="2" data-label="open">open me</button>
    </div>
  </div>
</section>

<!-- ============ PAGE 2 ============ -->
<section class="page" id="p2">
  <div class="sec observe">
    <div class="traits">
      <div class="trait-col left" id="traitsL"></div>
      <div class="blob-wrap" id="blobWrap"><div class="blob"></div><img id="mainImg" alt=""></div>
      <div class="trait-col" id="traitsR"></div>
    </div>
  </div>
  <div class="sec observe">
    <div class="memories">
      <p class="reveal" id="revealText" dir="auto"></p>
      <div class="collage" id="collage"></div>
    </div>
  </div>
  <div class="sec observe">
    <div class="letter-wrap">
      <div class="letter"><div class="letter-inner" dir="auto">
        <p class="letter-title" id="letterTitle"></p>
        <p class="letter-body" id="letterBody"></p>
        <p class="letter-sign" id="letterSign"></p>
      </div></div>
      <div class="mini-row" id="miniRow"></div>
      <div class="end-row"><button class="pill" data-go="3" data-label="next">next</button></div>
    </div>
  </div>
</section>

<!-- ============ PAGE 3 ============ -->
<section class="page" id="p3">
  <div class="gallery">
    <h2 class="g-title" id="galleryTitle" dir="auto"></h2>
    <p class="g-sub" id="gallerySub" dir="auto"></p>
    <div class="g-grid" id="gGrid"></div>
    <div class="end-row"><button class="pill" data-go="4" data-label="next">next</button></div>
  </div>
</section>

<!-- ============ PAGE 4 ============ -->
<section class="page" id="p4">
  <div class="reasons">
    <h2 class="r-title" id="reasonsTitle" dir="auto"></h2>
    <p class="r-sub" id="reasonsSub" dir="auto"></p>
    <div class="r-grid" id="rGrid"></div>
    <p class="r-count" id="rCount"></p>
    <p class="r-done" id="rDone" dir="auto"></p>
    <div class="end-row"><button class="pill" data-go="5" data-label="next">next</button></div>
  </div>
</section>

<!-- ============ PAGE 5 ============ -->
<section class="page" id="p5">
  <div class="msg">
    <div class="env-wrap" id="envWrap">
      <div class="envelope" id="envelope">
        <div class="env-back"></div>
        <div class="env-paper"></div>
        <div class="env-front"></div>
        <div class="env-flap"></div>
        <div class="env-seal">&#10084;</div>
      </div>
      <p class="env-hint" data-label="tapToOpen">tap to open</p>
    </div>
    <div class="paper" id="paper" dir="auto"></div>
    <div class="end-row"><button class="pill" data-go="6" data-label="next">next</button></div>
  </div>
</section>

<!-- ============ PAGE 6 ============ -->
<section class="page" id="p6">
  <div class="voice">
    <h2 id="voiceTitle" dir="auto"></h2>
    <p class="sub" id="voiceSub" dir="auto"></p>
    <div class="record" id="record"><img id="voiceImg" alt=""></div>
    <div class="vctrl">
      <div class="wave" id="waveL"></div>
      <button class="play-btn" id="voiceBtn" aria-label="play voice note"></button>
      <div class="wave" id="waveR"></div>
    </div>
    <div class="progress" id="vProg"><div id="vBar"></div></div>
    <div class="time" id="vTime">0:00 / 0:00</div>
    <button class="pill" data-go="7" data-label="next">next</button>
  </div>
</section>

<!-- ============ PAGE 7 ============ -->
<section class="page" id="p7">
  <div class="songs">
    <div class="songs-photo" id="songsPhoto"><img id="songsImg" alt=""></div>
    <div>
      <div class="songs-head">
        <h2 id="songsTitle"></h2>
        <span id="songsSub"></span>
        <p class="songs-hint">(tap any cover to play)</p>
      </div>
      <div class="covers" id="covers"></div>
      <div class="now" id="now"><span id="nowText"></span><div class="now-bar"><div id="nowBar"></div></div></div>
      <div class="end-row"><button class="pill" data-go="8" data-label="next">next</button></div>
    </div>
  </div>
</section>

<!-- ============ PAGE 8 ============ -->
<section class="page" id="p8">
  <div class="ask" id="ask">
    <img class="ask-img" id="askImg" alt="">
    <h2 class="ask-q" id="askQ" dir="auto"></h2>
    <div class="ask-btns">
      <button class="yes-btn" id="yesBtn" data-label="yes">yes</button>
      <button class="no-btn" id="noBtn" data-label="no">no</button>
    </div>
    <div class="ask-yes">
      <p class="yes-msg" id="yesMsg" dir="auto"></p>
      <button class="pill" data-go="9" data-label="next">next</button>
    </div>
  </div>
</section>

<!-- ============ PAGE 9 ============ -->
<section class="page" id="p9">
  <div class="finale" id="finale">
    <h2 class="f-title" id="finaleTitle" dir="auto"></h2>
    <p class="f-hint" data-label="blowHint">tap the cake to blow out the candles</p>
    <div class="cake-wrap" id="cakeWrap">
      <div class="cake" id="cake" role="button" aria-label="blow out the candles">
        <div class="candles" id="candles"></div>
        <div class="tier top"></div>
        <div class="tier bottom"><span class="dots"></span></div>
        <div class="plate"></div>
      </div>
    </div>
    <p class="f-final" id="finaleText" dir="auto"></p>
    <button class="pill f-again" data-go="1" data-label="again">start again</button>
  </div>
</section>

<div class="lightbox" id="lightbox" onclick="closeLightbox()"><figure><img id="lbImg" alt=""><figcaption id="lbCap" dir="auto"></figcaption></figure></div>
<canvas id="confetti"></canvas>
<button id="musicBtn" aria-label="music on/off"></button>
<div id="toast"></div>

<audio id="bgAudio" loop preload="auto" playsinline></audio>
<audio id="voiceAudio" preload="metadata" playsinline></audio>
<audio id="songAudio" preload="none" playsinline></audio>

<script>
const $ = id => document.getElementById(id);
const PAGES = document.querySelectorAll('.page').length;
const TX = Object.assign({
  open: 'open me', next: 'next', nowPlaying: 'now playing', tapToOpen: 'tap to open',
  blowHint: 'tap the cake to blow out the candles', again: 'start again', yes: 'yes', no: 'no'
}, CONFIG.texts || {});

document.title = CONFIG.tabTitle;
document.querySelectorAll('[data-label]').forEach(el => { if (TX[el.dataset.label]) el.textContent = TX[el.dataset.label]; });

function ph(label){
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect width="400" height="400" fill="#d8cdcd"/><text x="200" y="210" font-family="sans-serif" font-size="30" fill="#86454e" text-anchor="middle">${label}</text></svg>`);
}
function pic(src, label, cls = ''){
  return `<img src="${src}" class="${cls}" alt="" loading="lazy" onerror="this.onerror=null;this.src=ph('${label}')">`;
}
function setImg(el, src, label){
  el.onerror = () => { el.onerror = null; el.src = ph(label); };
  el.src = src;
}
function fmt(s){ s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

let toastTimer;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

/* ---- confetti engine ---- */
const cv = $('confetti'), cx = cv.getContext('2d');
let parts = [], confRAF = null;
function resizeCv(){
  const d = window.devicePixelRatio || 1;
  cv.width = innerWidth * d; cv.height = innerHeight * d;
  cx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', resizeCv); resizeCv();
const CCOLORS = ['#e7a3b1', '#c9707f', '#86454e', '#f6dfe3', '#e8c547', '#ffffff'];

function confetti(x, y, n = 120){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, sp = 4 + Math.random() * 8;
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 6, w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
      r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3, c: CCOLORS[i % CCOLORS.length], life: 0 });
  }
  if (!confRAF) confRAF = requestAnimationFrame(tickConfetti);
}
function tickConfetti(){
  cx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.y < innerHeight + 40 && p.life < 300);
  parts.forEach(p => {
    p.life++; p.vx *= 0.985; p.vy = p.vy * 0.985 + 0.25; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
    cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.cos(p.life * 0.1));
    cx.restore();
  });
  confRAF = parts.length ? requestAnimationFrame(tickConfetti) : null;
}

/* ---- navigation ---- */
$('nav').innerHTML = Array.from({ length: PAGES }, (_, i) =>
  `<button data-go="${i + 1}" data-num="${i + 1}" class="${i === 0 ? 'active' : ''}">${CONFIG.navLabels[i] || 'Page ' + (i + 1)}</button>`).join('');

/* ---- page 1 : hero ---- */
$('heroTitle').innerHTML = CONFIG.heroLines.map((l, i) => `<span style="animation-delay:${0.1 + i * 0.2}s">${l}</span>`).join('');
setImg($('babyImg'), CONFIG.babyPhoto, 'baby photo');
$('openBtn').addEventListener('click', e => {
  const r = e.currentTarget.getBoundingClientRect();
  confetti(r.left + r.width / 2, r.top + r.height / 2, 100);
});

/* ---- page 2 : traits / polaroids ---- */
function traitCol(list, side){
  const n = list.length;
  return list.map((t, i) => {
    const off = Math.round(42 * Math.sin(Math.PI * (n > 1 ? i / (n - 1) : 0.5)));
    return `<span class="trait" dir="auto" style="${side}:${off}px;transition-delay:${(0.1 + i * 0.12).toFixed(2)}s">${t}</span>`;
  }).join('');
}
$('traitsL').innerHTML = traitCol(CONFIG.traitsLeft, 'right');
$('traitsR').innerHTML = traitCol(CONFIG.traitsRight, 'left');
setImg($('mainImg'), CONFIG.mainPhoto, 'photo');

(function buildReveal(){
  const text = CONFIG.memoriesText;
  const arabic = /[\u0600-\u06FF]/.test(text);
  let html = '';
  text.split(/(\*[^*]+\*)/).forEach(part => {
    if (!part) return;
    const hl = part.length > 2 && part.startsWith('*') && part.endsWith('*');
    const clean = hl ? part.slice(1, -1) : part;
    const units = arabic ? clean.split(/(\s+)/) : [...clean];
    units.forEach(u => {
      if (!u) return;
      if (/^\s+$/.test(u)){ html += ' '; return; }
      html += `<span${hl ? ' class="hl"' : ''} style="transition-delay:${(Math.random() * 1.2).toFixed(2)}s">${u}</span>`;
    });
  });
  $('revealText').innerHTML = html;
})();

const POS = [[4,2,-6],[33,7,5],[64,3,3],[1,46,4],[32,50,-3],[63,43,-7]];
$('collage').innerHTML = CONFIG.polaroids.slice(0, 6).map((src, i) => {
  const [l, t, r] = POS[i];
  return `<div class="polaroid" style="left:${l}%;top:${t}%;--r:${r}deg;--d:${(0.1 + i * 0.1).toFixed(2)}s">${pic(src, 'photo ' + (i + 1))}</div>`;
}).join('');

$('letterTitle').textContent = CONFIG.letterTitle;
$('letterBody').textContent = CONFIG.letter.trim();
$('letterSign').textContent = CONFIG.letterSign;
$('miniRow').innerHTML = CONFIG.letterPhotos.map((s, i) => pic(s, 'pic ' + (i + 1), 'mini')).join('');

/* ---- page 3 : gallery ---- */
$('galleryTitle').textContent = CONFIG.galleryTitle;
$('gallerySub').textContent = CONFIG.gallerySubtitle;
const ROT = [-3, 2, -1.5, 3, -2.5, 1.5];
$('gGrid').innerHTML = CONFIG.gallery.map((g, i) => `
  <button class="g-card" style="--r:${ROT[i % ROT.length]}deg;--d:${(i * 0.08).toFixed(2)}s" onclick="openLightbox('${g.photo}', '')">
    <span class="tape"></span>
    ${pic(g.photo, 'photo ' + (i + 1))}
  </button>`).join('');

function openLightbox(src, cap) {
  $('lbImg').src = src;
  $('lbCap').innerText = cap;
  $('lightbox').classList.add('on');
}
function closeLightbox() {
  $('lightbox').classList.remove('on');
}

/* ---- page 4 : 21 reasons ---- */
$('reasonsTitle').textContent = CONFIG.reasonsTitle;
$('reasonsSub').textContent = CONFIG.reasonsSubtitle;
const RS = Array.isArray(CONFIG.reasons) ? CONFIG.reasons : [];
$('rGrid').innerHTML = RS.map((t, i) =>
  `<button class="rcard" style="--d:${(i * 0.03).toFixed(2)}s"><span class="rinner"><span class="rface rfront"><b>${i + 1}</b><i>&#9829;</i></span><span class="rface rback" dir="auto">${t}</span></span></button>`).join('');
const seenReasons = new Set();
document.querySelectorAll('.rcard').forEach((c, i) => c.addEventListener('click', () => {
  c.classList.toggle('flip');
  if (seenReasons.has(i)) return;
  seenReasons.add(i);
  $('rCount').textContent = `${seenReasons.size} / ${RS.length} revealed`;
  if (seenReasons.size === RS.length) {
    $('rDone').textContent = "All reasons unlocked! 💜";
    $('rDone').classList.add('on');
    confetti(innerWidth / 2, innerHeight * 0.7, 150);
  }
}));

/* ---- page 5 : message (الجواب) ---- */
const paper = $('paper');
function addP(txt, cls){
  if (!txt) return;
  const p = document.createElement('p');
  p.className = cls;
  p.textContent = txt;
  paper.appendChild(p);
}
addP(CONFIG.messageTo, 'm-to');
CONFIG.message.trim().split(/\n\s*\n/).forEach(t => addP(t.trim(), 'm-body'));
addP(CONFIG.messageFrom, 'm-from');

const paraIO = new IntersectionObserver(entries => {
  let k = 0;
  entries.forEach(en => {
    if (!en.isIntersecting) return;
    en.target.style.transitionDelay = (k++ * 0.18).toFixed(2) + 's';
    en.target.classList.add('in');
    paraIO.unobserve(en.target);
  });
}, { threshold: 0.1 });

let envOpened = false;
$('envelope').addEventListener('click', () => {
  if (envOpened) return;
  envOpened = true;
  $('envelope').classList.add('open');
  setTimeout(() => {
    $('envWrap').classList.add('gone');
    paper.classList.add('show');
    paper.querySelectorAll('p').forEach(p => paraIO.observe(p));
  }, 900);
});

/* ---- page 6 : voice note player ---- */
$('voiceTitle').textContent = CONFIG.voiceTitle;
$('voiceSub').textContent = CONFIG.voiceSubtitle;
setImg($('voiceImg'), CONFIG.voicePhoto, 'photo');

const voiceAudio = $('voiceAudio');
voiceAudio.src = CONFIG.voiceNote;

const bars = n => Array.from({ length: n }, () => `<i style="--h:${Math.round(30 + Math.random() * 70)}%;--dl:${(Math.random() * 0.9).toFixed(2)}s"></i>`).join('');
$('waveL').innerHTML = bars(9);
$('waveR').innerHTML = bars(9);

const voiceBtn = $('voiceBtn');
voiceBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';

let isVoicePlaying = false;
voiceBtn.addEventListener('click', () => {
  if (isVoicePlaying) {
    voiceAudio.pause();
  } else {
    stopSong();
    pauseBg();
    voiceAudio.play().catch(e => toast('voice note file not found'));
  }
});

voiceAudio.addEventListener('play', () => {
  isVoicePlaying = true;
  voiceBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
  $('record').classList.add('playing');
  document.querySelectorAll('.wave').forEach(w => w.classList.add('playing'));
});

voiceAudio.addEventListener('pause', () => {
  isVoicePlaying = false;
  voiceBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  $('record').classList.remove('playing');
  document.querySelectorAll('.wave').forEach(w => w.classList.remove('playing'));
  playBg();
});

voiceAudio.addEventListener('timeupdate', () => {
  const d = isFinite(voiceAudio.duration) ? voiceAudio.duration : 0;
  $('vBar').style.width = d ? (voiceAudio.currentTime / d * 100) + '%' : '0%';
  $('vTime').textContent = fmt(voiceAudio.currentTime) + ' / ' + fmt(d);
});

$('vProg').addEventListener('click', e => {
  if (!isFinite(voiceAudio.duration)) return;
  const r = e.currentTarget.getBoundingClientRect();
  voiceAudio.currentTime = (e.clientX - r.left) / r.width * voiceAudio.duration;
});

/* ---- page 7 : songs player ---- */
$('songsTitle').textContent = CONFIG.songsTitle;
$('songsSub').innerHTML = CONFIG.songsSubtitle;
setImg($('songsImg'), CONFIG.songsPhoto, 'photo');

$('covers').innerHTML = CONFIG.songs.map((s, i) => `
  <button class="cover" data-i="${i}" style="--d:${(i * 0.02).toFixed(2)}s">
    ${pic(s.cover, 'cover ' + (i + 1))}
    ${CONFIG.showSongTitles ? `<span class="cap" dir="auto">${s.title}</span>` : ''}
  </button>`).join('');

const songAudio = $('songAudio');
let currentSongIdx = -1;

function stopSong() {
  if (currentSongIdx < 0) return;
  songAudio.pause();
  document.querySelectorAll('.cover').forEach(c => c.classList.remove('playing'));
  $('now').classList.remove('on');
  currentSongIdx = -1;
}

document.querySelectorAll('.cover').forEach(btn => btn.addEventListener('click', () => {
  const i = +btn.dataset.i;
  if (currentSongIdx === i && !songAudio.paused) {
    stopSong();
    playBg();
    return;
  }
  
  voiceAudio.pause();
  pauseBg();
  
  document.querySelectorAll('.cover').forEach(c => c.classList.remove('playing'));
  currentSongIdx = i;
  btn.classList.add('playing');
  
  const s = CONFIG.songs[i];
  songAudio.src = s.file;
  songAudio.currentTime = s.start || 0;
  songAudio.play().catch(e => toast('song file not found'));
  
  $('nowText').textContent = `${TX.nowPlaying}: ${s.title} - ${s.artist}`;
  $('now').classList.add('on');
}));

songAudio.addEventListener('timeupdate', () => {
  if (currentSongIdx < 0) return;
  const s = CONFIG.songs[currentSongIdx];
  const start = s.start || 0;
  const end = s.end || (isFinite(songAudio.duration) ? songAudio.duration : 0);
  if (!end) return;
  
  const progress = Math.min(100, Math.max(0, (songAudio.currentTime - start) / (end - start) * 100));
  $('nowBar').style.width = progress + '%';
  
  if (s.end && s.end > 0 && songAudio.currentTime >= s.end) {
    stopSong();
    playBg();
  }
});

songAudio.addEventListener('ended', () => {
  stopSong();
  playBg();
});

/* ---- page 8 : question (Dodge logic without overlap) ---- */
const yesBtn = $('yesBtn'), noBtn = $('noBtn');
$('askQ').textContent = CONFIG.loveQuestion;
$('yesMsg').textContent = CONFIG.yesText;

let dodges = 0;
function dodge(e){
  if (dodges >= 8) return;
  if (e){ e.preventDefault(); e.stopPropagation(); }
  dodges++;

  const r = noBtn.getBoundingClientRect();
  const w = r.width, h = r.height;
  const px = e && e.clientX != null ? e.clientX : r.left + w / 2;
  const py = e && e.clientY != null ? e.clientY : r.top + h / 2;

  // Get Yes Button coordinates to ensure NO overlap
  const yr = yesBtn.getBoundingClientRect();
  const yx = yr.left + yr.width / 2;
  const yy = yr.top + yr.height / 2;

  let x, y, tries = 0;
  do {
    x = 16 + Math.random() * Math.max(10, innerWidth - w - 32);
    y = 60 + Math.random() * Math.max(10, innerHeight - h - 80);
    tries++;
  } while (
    tries < 30 &&
    (Math.hypot(x + w / 2 - px, y + h / 2 - py) < 140 ||
     Math.hypot(x + w / 2 - yx, y + h / 2 - yy) < 160)
  );

  if (!noBtn.classList.contains('run')){
    noBtn.style.left = r.left + 'px';
    noBtn.style.top = r.top + 'px';
    noBtn.classList.add('run');
    void noBtn.offsetWidth;
  }
  noBtn.style.left = x + 'px';
  noBtn.style.top = y + 'px';
}

noBtn.addEventListener('pointerdown', dodge);
noBtn.addEventListener('mouseenter', dodge);

yesBtn.addEventListener('click', () => {
  const r = yesBtn.getBoundingClientRect();
  confetti(r.left + r.width / 2, r.top + r.height / 2, 140);
  noBtn.style.display = 'none';
  $('ask').classList.add('done');
});

/* ---- page 9 : cake ---- */
$('finaleTitle').textContent = CONFIG.finaleTitle;
$('finaleText').textContent = CONFIG.finaleText;
if (CONFIG.cakePurple) $('cake').classList.add('purple');

const candlesContainer = $('candles');
const ageDigits = String(CONFIG.age || '').replace(/\D/g, '');
if (ageDigits){
  candlesContainer.classList.add('nums');
  candlesContainer.innerHTML = [...ageDigits].map((d, i) =>
    `<div class="candle num"><span class="digit">${d}</span><span class="flame" style="animation-delay:${(i * 0.07).toFixed(2)}s"></span><span class="smoke"></span></div>`).join('');
} else {
  const nCandles = Math.max(1, Math.min(12, parseInt(CONFIG.candles, 10) || 5));
  candlesContainer.innerHTML = Array.from({ length: nCandles }, (_, i) =>
    `<div class="candle" style="height:${42 + (i % 3) * 4}px"><span class="flame" style="animation-delay:${(i * 0.05).toFixed(2)}s"></span><span class="smoke"></span></div>`).join('');
}

let blown = false;
function resetCake(){
  blown = false;
  document.querySelectorAll('.candle').forEach(c => c.classList.remove('out'));
  $('cakeWrap').classList.remove('out');
  $('finale').classList.remove('done');
  $('fHint').innerText = TX.blowHint;
}

$('cake').addEventListener('click', () => {
  if (blown) return;
  blown = true;
  const cs = [...document.querySelectorAll('.candle')];
  cs.forEach((c, i) => setTimeout(() => c.classList.add('out'), i * 160));
  setTimeout(() => {
    $('cakeWrap').classList.add('out');
    $('fHint').innerText = "Make a wish! ✨";
    const r = $('cake').getBoundingClientRect();
    confetti(r.left + r.width / 2, r.top + 20, 160);
    $('finale').classList.add('done');
  }, cs.length * 160 + 300);
});

/* ---- background audio ---- */
const bgAudio = $('bgAudio');
bgAudio.src = CONFIG.bgMusic;
bgAudio.volume = CONFIG.bgVolume || 0.35;

let started = false;
let musicOn = true;

function playBg(){
  if (!started || !musicOn) return;
  if (!voiceAudio.paused || !songAudio.paused) return;
  if (bgAudio.paused){
    bgAudio.play().catch(e => {});
  }
}
function pauseBg(){
  if (!bgAudio.paused) bgAudio.pause();
}

const musicBtn = $('musicBtn');
musicBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>';
musicBtn.addEventListener('click', () => {
  started = true;
  musicOn = !musicOn;
  musicBtn.classList.toggle('off', !musicOn);
  if (musicOn) playBg();
  else pauseBg();
});

/* ---- gate countdown ---- */
const gate = $('gate');
function renderGate(){
  $('gateKicker').textContent = "Counting down to " + NAME;
  $('gateTitle').textContent = "Happy 21st Birthday, " + NAME;
  $('gateBtn').textContent = "Open Website ✨";
  $('gateBtn').hidden = false;
}
renderGate();

$('gateBtn').addEventListener('click', () => {
  started = true;
  playBg();
  gate.classList.add('leave');
  setTimeout(() => gate.classList.add('gone'), 600);
});

/* ---- navigation ---- */
function go(n){
  n = Math.min(PAGES, Math.max(1, n));
  stopSong();
  voiceAudio.pause();
  closeLightbox();
  if (n === 9) resetCake();
  
  document.querySelectorAll('.page').forEach((p, i) => p.classList.toggle('active', i + 1 === n));
  document.querySelectorAll('nav button').forEach((b, i) => b.classList.toggle('active', i + 1 === n));
  window.scrollTo({top: 0, behavior: 'smooth'});
  playBg();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go]');
  if (!t) return;
  started = true;
  go(+t.dataset.go);
});

/* ---- scroll observer ---- */
const io = new IntersectionObserver(entries => entries.forEach(en => {
  if (en.isIntersecting) en.target.classList.add('show');
}), { threshold: 0.15 });
document.querySelectorAll('.observe').forEach(el => io.observe(el));
</script>
</body>
</html>
